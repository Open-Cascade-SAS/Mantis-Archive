name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      RELEASE_TAG: V0.0.1
      DEFAULT_ASSET_NAME: dist.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve asset name
        id: vars
        run: |
          set -euo pipefail
          echo "asset_name=$DEFAULT_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.vars.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP/release"

      - name: Extract archive
        id: extract
        env:
          ASSET_NAME: ${{ steps.vars.outputs.asset_name }}
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/release/$ASSET_NAME"
          extracted="$RUNNER_TEMP/extracted"
          publish_dir="$RUNNER_TEMP/site"

          rm -rf "$extracted" "$publish_dir"
          mkdir -p "$extracted" "$publish_dir"

          unzip -q "$archive" -d "$extracted"

          if [ -f "$extracted/index.html" ]; then
            cp -R "$extracted"/. "$publish_dir"/
          else
            first_dir="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            [ -n "$first_dir" ]
            cp -R "$first_dir"/. "$publish_dir"/
          fi

          [ -f "$publish_dir/index.html" ]

          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Prune heavy attachments from Pages copy
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 scripts/prune_pages_payload.py \
            --site-root "${{ steps.extract.outputs.publish_dir }}" \
            --release-tag "$RELEASE_TAG" \
            --image-max-bytes 1500000 \
            --file-max-bytes 100000

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.extract.outputs.publish_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
